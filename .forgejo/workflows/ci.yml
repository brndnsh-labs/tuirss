name: CI

# Runs tuirss's gates (typecheck + tests, same as `bun run check`) on every PR to
# main and on main itself.
#
# Bun project: the host-mode Forgejo Actions runner on ghrunner01 (LXC 707) only
# bootstraps node, so we bring bun in per-job via oven-sh/setup-bun (resolves from
# github.com — forgejo app.ini DEFAULT_ACTIONS_URL=github). runs-on MUST be exactly
# [self-hosted]: the runner advertises only [self-hosted ensemble], so GitHub's
# default [self-hosted, Linux, X64] would sit in "waiting" forever.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test
