# CI: runs on every push to master and on every pull request.
# GitHub runs these jobs on fresh virtual machines; results show up as a
# check mark (or red X) next to each commit on GitHub.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read # CI only reads the code

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is the main platform; macOS too, since releases include it.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # use the Go version go.mod asks for

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt -w:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  release-dry-run:
    # Builds every release target without publishing anything, so a broken
    # .goreleaser.yaml is caught here instead of on release day.
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser needs the full history and tags

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
