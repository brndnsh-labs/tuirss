name: CI

# Runs tuirss's gates (typecheck + tests, same as `bun run check`) on every PR to
# main and on main itself.
#
# Runs on GitHub-hosted runners, not ghrunner01: this repo is public, and the org's
# self-hosted runner group sets allows_public_repositories=false (a fork PR would
# otherwise execute arbitrary code on the box). A public repo pinned to
# `self-hosted` queues forever with no error, so do not "fix" it that way.
#
# Bun is not preinstalled on ubuntu-latest, so it comes in per-job via
# oven-sh/setup-bun.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test
